- id: yaml-to-pretty-json
  home: true
  featured: true
  label: YAML to Pretty JSON
  description: >-
    Load an external YAML file and print it as compact, readable JSON.
  entry: main.ys
  source: |
    !ys-0

    use: json yaml pretty-json

    defn main():
      data =: read('file.yaml'):yaml/load
      text =: data:json/dump
      say: text:pretty-json/format
  files:
    file.yaml: |
      services:
      - name: orders-api
        image: ghcr.io/acme/orders:1.4
        labels:
          app: orders
          team: platform
      - name: orders-worker
        image: ghcr.io/acme/orders:1.4
        labels:
          app: orders
          team: platform
    pretty-json.ys: |
      !ys-0

      ns: pretty-json

      use: json

      defn format(text):
        text:json/load.format-value(0)
          .tighten-array-indentation()
          .tighten-json()

      defn- format-value(value indent):
        cond:
          map?(value): format-map(value indent)
          vector?(value): format-list(value indent)
          else: json/dump(value)

      defn- format-map(value indent):
        if value.!:
          then: '{}'
          else:
            outer =: :' ' * indent
            inner =: :' ' * (indent + 2)
            lines =:
              for key keys(value):
                item =: format-value(value.$key (indent + 2))
                str: inner json/dump(key) ':' ' ' item
            body =: lines.join(",\n")
            =>: "{\n$body\n$outer}"

      defn- format-list(value indent):
        if value.!:
          then: '[]'
          else:
            outer =: :' ' * indent
            inner =: :' ' * (indent + 2)
            lines =:
              for item value:
                =>: "$inner$(format-value(item (indent + 2)))"
            body =: lines.join(",\n")
            =>: "[\n$body\n$outer]"

      defn- tighten-array-indentation(pretty):
        input =: pretty:lines
        loop lines input, arrays [], output []:
          if lines.!:
            then: output.join("\n")
            else:
              line =: lines.0
              trimmed =: line:trim
              closing-array =:
                trimmed.eq(']') || trimmed.eq('],')
              arrays :if closing-array .=: pop()
              indent =: line.# - line:triml.#
              reduction =:
                arrays.filter(\(_.compact)).# * 2
              spaces =: :' ' * max(0 (indent - reduction))
              output .=: conj(spaces + trimmed)
              next-line =: lines.1 || ''
              compact =: next-line:trim.eq('{')
              array-open =:
                trimmed.eq('[') || trimmed.ends?(':\ [')
              arrays :if array-open .=: conj({:compact compact})
              recur: lines:rest, arrays, output

      defn- tighten-json(pretty):
        output =:
          loop lines pretty:lines, output []:
            if lines.!:
              then: output
              else:
                line =: lines.0
                trimmed =: line:trim
                opening =: trimmed.eq('{') || trimmed.eq('[')
                closing =:
                  trimmed.in?(['}' '},' ']' '],'])
                next-output =:
                  cond:
                    opening && output.?:
                      last =: output.$
                      separator =:
                        if trimmed.eq('{') && last.ends?('['): :'' ' '
                      output: .pop().conj(last + separator + trimmed)
                    closing && output.?:
                      last =: output.$
                      closed =:
                        last.ends?('}') || last.ends?(']')
                      separator =:
                        if closed: :'' ' '
                      output: .pop().conj(
                        last + separator + trimmed)
                    else: output.conj(line)
                recur: lines:rest, next-output
        root =: output.0.eq('{') || output.0.eq('[')
        if (output.# > 1) && root:
          then:
            first =: output.0 + ' ' + output.1:triml
            join "\n": cons(first output.drop(2))
          else: output.join("\n")
  expected: |
    { "services": [{
        "name": "orders-api",
        "image": "ghcr.io/acme/orders:1.4",
        "labels": {
          "app": "orders",
          "team": "platform" }}, {
        "name": "orders-worker",
        "image": "ghcr.io/acme/orders:1.4",
        "labels": {
          "app": "orders",
          "team": "platform" }}]}
