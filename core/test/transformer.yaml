- name: require simple library
  yamlscript: |
    !ys-0
    require: foo::bar
  clojure: |
    (require 'foo.bar)


- name: require simple library with nil pair value
  yamlscript: |
    !ys-0
    require foo::bar:
  clojure: |
    (require 'foo.bar)


- name: require library with alias
  yamlscript: |
    !ys-0
    require foo::bar: :as fb
  clojure: |
    (require '[foo.bar :as fb])


- name: require one-part library with alias
  yamlscript: |
    !ys-0
    require foo: :as f
  clojure: |
    (require '[foo :as f])


- name: require one-part library with alias
  yamlscript: |
    !ys-0
    require:
      foo: :as f
      bar: :as b
  clojure: |
    (require '[foo :as f] '[bar :as b])


- name: Transform require and cond
  yamlscript: |
    !ys-0
    require foo::bar: :as fb
    cond:
      (x == 1): "one"
      (x == 2): "two"
      else: "other"
  clojure: |
    (require '[foo.bar :as fb])
    (cond (= x 1) "one" (= x 2) "two" :else "other")


- name: Allow => as else for cond
  yamlscript: |
    !ys-0
    cond:
      (a > b): c
      (a < d): e
      =>: f
  clojure: |
    (cond (> a b) c (< a d) e :else f)


- name: Wrap multiple scalar forms in a cond body
  yamlscript: |
    !ys-0
    cond:
      true: 1 2 3
  transform: |
    {:xmap
     [{:Sym cond}
      {:fmap
       [{:Bln true}
        {:xmap [{:Sym do} [{:Int 1} {:Int 2} {:Int 3}]]}]}]}
  clojure: |
    (cond true (do 1 2 3))


- name: Wrap multiple scalar forms in a cond test
  yamlscript: |
    !ys-0
    cond:
      false true: 1
  clojure: |
    (cond (do false true) 1)


- name: Normalize mapping bodies for cond
  yamlscript: |
    !ys-0
    cond:
      a:
        x: 1
        y: 2
      b: q
      c: r
      else:
        z: 3
        q: 4
  clojure: |
    (cond a (do (x 1) (y 2)) b q c r :else (do (z 3) (q 4)))


- name: Normalize bodies and => default for condf
  yamlscript: |
    !ys-0
    condf value:
      :Int:
        x: 1
        y: 2
      :Str: z
      =>:
        q: 3
        r: 4
  clojure: |
    (condf value :Int (do (x 1) (y 2)) :Str z (do (q 3) (r 4)))


- name: Normalize bodies and else default for condp
  yamlscript: |
    !ys-0
    condp eq value:
      1:
        x: 1
        y: 2
      2: z
      else:
        q: 3
        r: 4
  clojure: |
    (condp eq value 1 (do (x 1) (y 2)) 2 z (do (q 3) (r 4)))


- name: Normalize bodies and => default for case
  yamlscript: |
    !ys-0
    case value:
      a:
        x: 1
        y: 2
      b: z
      =>:
        q: 3
        r: 4
  clojure: |
    (case value a (do (x 1) (y 2)) b z (do (q 3) (r 4)))


- name: Normalize bodies in generic form maps
  yamlscript: |
    !ys-0
    foo %:
      a: 1 2 3
      b:
        x: 1
        y: 2
      c: z
      =>:
        q: 3
        r: 4
  transform: |
    {:xmap
     [{:Sym foo}
      {:fmap
       [{:Sym a}
        {:xmap [{:Sym do} [{:Int 1} {:Int 2} {:Int 3}]]}
        {:Sym b}
        {:xmap [{:Sym do} {:xmap [{:Sym x} {:Int 1}
                                  {:Sym y} {:Int 2}]}]}
        {:Sym c}
        {:Sym z}
        {:Sym =>}
        {:xmap [{:Sym do} {:xmap [{:Sym q} {:Int 3}
                                  {:Sym r} {:Int 4}]}]}]}]}
  clojure: |
    (foo a (do 1 2 3) b (do (x 1) (y 2)) c z (do (q 3) (r 4)))


- name: Normalize both sides of generic form maps
  yamlscript: |
    !ys-0
    foo %:
      1 2 3: 4 5 6
  clojure: |
    (foo (do 1 2 3) (do 4 5 6))


- name: Various require transformations
  yamlscript: |
    !ys-0
    require foo::aaa: :as fa
    require foo::bbb: :get one
    require foo::ccc: :get one two
    require foo::ddd: :as fd :get one two
  clojure: |
    (require '[foo.aaa :as fa])
    (require '[foo.bbb :refer [one]])
    (require '[foo.ccc :refer [one two]])
    (require '[foo.ddd :as fd :refer [one two]])


- name: Various require transformations in one pair
  yamlscript: |
    !ys-0
    require:
      foo::aaa: :as fa
      foo::bbb: :get one
      foo::ccc: :get one two
      foo::ddd: :as fd :get one two
      foo::eee:
      foo::fff: :all
  clojure: |
    (require
      '[foo.aaa :as fa]
      '[foo.bbb :refer [one]]
      '[foo.ccc :refer [one two]]
      '[foo.ddd :as fd :refer [one two]]
      'foo.eee
      '[foo.fff :refer :all])


- name: 'require ns: :all'
  yamlscript: |
    !ys-0
    require foo::bar: :all
  clojure: |
    (require '[foo.bar :refer :all])


- name: Require all except selected names
  yamlscript: |
    !ys-0
    require foo::bar: :not one two
    require foo::baz: :all :not three four
  clojure: |
    (require '[foo.bar :refer :all :exclude [one two]])
    (require '[foo.baz :refer :all :exclude [three four]])


- name: Require no referred names
  yamlscript: |
    !ys-0
    require foo::bar: :none
    require foo::baz: :none :as baz
  clojure: |
    (require 'foo.bar)
    (require '[foo.baz :as baz])


- name: Require and rename selected names
  yamlscript: |
    !ys-0
    require foo::bar: :get one/first two three/third
  clojure: |
    (require
      '[foo.bar :refer [one two three] :rename {one first, three third}])


- name: Error on legacy require alias syntax
  yamlscript: |
    !ys-0
    require foo::bar: => fb one two
  error: >
    Legacy 'require' syntax '=> fb one two'. Use ':as fb :get one two'
    instead.


- name: Error on legacy require refer syntax
  yamlscript: |
    !ys-0
    require foo::bar: one two
  error: >
    Legacy 'require' syntax 'one two'. Use ':get one two' instead.


- name: Error on Clojure require refer option
  yamlscript: |
    !ys-0
    require foo::bar: :refer one two
  error: >
    Invalid 'require' option ':refer'. Use ':get' instead.


- name: Error on require option without arguments
  yamlscript: |
    !ys-0
    require foo::bar: :get
  error: >
    Invalid 'require' option ':get': expected at least one symbol


- name: Error on require alias option without an argument
  yamlscript: |
    !ys-0
    require foo::bar: :as
  error: |
    Invalid 'require' option ':as': expected one symbol


- name: Error on require exclusion option without arguments
  yamlscript: |
    !ys-0
    require foo::bar: :not
  error: |
    Invalid 'require' option ':not': expected at least one symbol


- name: Error on unknown require option
  yamlscript: |
    !ys-0
    require foo::bar: :url thing
  error: |
    Invalid 'require' option ':url'


- name: Error on duplicate require option
  yamlscript: |
    !ys-0
    require foo::bar: :as fb :as fbb
  error: >
    Duplicate 'require' option ':as'


- name: Error on require all and get options
  yamlscript: |
    !ys-0
    require foo::bar: :all :get one
  error: >
    Invalid 'require' options: ':get' cannot be combined with ':all'


- name: Error on require get and not options
  yamlscript: |
    !ys-0
    require foo::bar: :get one :not two
  error: >
    Invalid 'require' options: ':get' cannot be combined with ':not'


- name: Error on require none and selection options
  yamlscript: |
    !ys-0
    require foo::bar: :none :all
  error: >
    Invalid 'require' options: ':none' cannot be combined with ':get',
    ':all', or ':not'


- name: Anonymous function with name
  yamlscript: |
    !ys-0
    fn add(a b): a + b
  clojure: |
    (fn add [a b] (add+ a b))


- name: Multi-arity anonymous function with name
  yamlscript: |
    !ys-0
    fn add:
      (): 0
      (a b): a + b
  clojure: |
    (fn add (() 0) ((a b) (add+ a b)))


- name: Keywords then and else for if
  yamlscript: |
    !ys-0
    if (x == 1):
      then:
        a: b
        c: d
      else:
        e: f
  clojure: |
    (if (= x 1) (do (a b) (c d)) (e f))


- name: Keywords then and else for if with scalar actions
  yamlscript: |
    !ys-0
    if (x == 1):
      then: a(b)
      else:
        c: d
        e: f
  clojure: |
    (if (= x 1) (a b) (do (c d) (e f)))


- name: Using else without then
  yamlscript: |
    !ys-0
    if (x == 1):
      a: b
      else: c
  clojure: |
    (if (= x 1) (a b) c)


- name: Using else without then for if-not
  yamlscript: |
    !ys-0
    if-not (x == 1):
      a: b
      else: c
  clojure: |
    (if-not (= x 1) (a b) c)


- name: Using then without else
  yamlscript: |
    !ys-0
    if (x == 1):
      then: a(b)
  error: |
    Invalid 'if' form


- name: Error when using then and not else
  yamlscript: |
    !ys-0
    if (x == 1):
      then: a(b)
      =>:
        c: d
        e: f
  error: |
    Form after 'then' must be 'else'


- name: Support vector destructuring in bindings with *xs
  yamlscript: |
    !ys-0
    for [x *xs] lst:
      a: b
  clojure: |
    (for [[x & xs] lst] (a b))


- name: Support vector destructuring if def
  yamlscript: |
    !ys-0
    defn foo():
      +[x *y] =: z
  clojure: |
    (defn foo [] (let [[x & y] z]))


- name: Dotted assignment root must be a symbol
  yamlscript: |
    !ys-0
    make().value =: 42
  error: |
    Dotted assignment root must be a symbol
