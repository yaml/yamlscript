- name: require simple library
  yamlscript: |
    !ys-0
    require: foo::bar
  clojure: |
    (require 'foo.bar)


- name: require simple library with nil pair value
  yamlscript: |
    !ys-0
    require foo::bar:
  clojure: |
    (require 'foo.bar)


- name: require library with alias
  yamlscript: |
    !ys-0
    require foo::bar: => fb
  clojure: |
    (require '[foo.bar :as fb])


- name: require one-part library with alias
  yamlscript: |
    !ys-0
    require foo: => f
  clojure: |
    (require '[foo :as f])


- name: require one-part library with alias
  yamlscript: |
    !ys-0
    require:
      foo: => f
      bar: => b
  clojure: |
    (require '[foo :as f] '[bar :as b])


- name: Transform require and cond
  yamlscript: |
    !ys-0
    require foo::bar: => fb
    cond:
      (x == 1): "one"
      (x == 2): "two"
      else: "other"
  clojure: |
    (require '[foo.bar :as fb])
    (cond (= x 1) "one" (= x 2) "two" :else "other")


- name: Allow => as else for cond
  yamlscript: |
    !ys-0
    cond:
      (a > b): c
      (a < d): e
      =>: f
  clojure: |
    (cond (> a b) c (< a d) e :else f)


- name: Wrap multiple scalar forms in a cond body
  yamlscript: |
    !ys-0
    cond:
      true: 1 2 3
  transform: |
    {:xmap
     [{:Sym cond}
      {:fmap
       [{:Bln true}
        {:xmap [{:Sym do} [{:Int 1} {:Int 2} {:Int 3}]]}]}]}
  clojure: |
    (cond true (do 1 2 3))


- name: Normalize mapping bodies for cond
  yamlscript: |
    !ys-0
    cond:
      a:
        x: 1
        y: 2
      b: q
      c: r
      else:
        z: 3
        q: 4
  clojure: |
    (cond a (do (x 1) (y 2)) b q c r :else (do (z 3) (q 4)))


- name: Normalize bodies and => default for condf
  yamlscript: |
    !ys-0
    condf value:
      :Int:
        x: 1
        y: 2
      :Str: z
      =>:
        q: 3
        r: 4
  clojure: |
    (condf value :Int (do (x 1) (y 2)) :Str z (do (q 3) (r 4)))


- name: Normalize bodies and else default for condp
  yamlscript: |
    !ys-0
    condp eq value:
      1:
        x: 1
        y: 2
      2: z
      else:
        q: 3
        r: 4
  clojure: |
    (condp eq value 1 (do (x 1) (y 2)) 2 z (do (q 3) (r 4)))


- name: Normalize bodies and => default for case
  yamlscript: |
    !ys-0
    case value:
      a:
        x: 1
        y: 2
      b: z
      =>:
        q: 3
        r: 4
  clojure: |
    (case value a (do (x 1) (y 2)) b z (do (q 3) (r 4)))


- name: Various require transformations
  yamlscript: |
    !ys-0
    require foo::aaa: => fa
    require foo::bbb: one
    require foo::ccc: one two
    require foo::ddd:
      => fd
      one two
  clojure: |
    (require '[foo.aaa :as fa])
    (require '[foo.bbb :refer [one]])
    (require '[foo.ccc :refer [one two]])
    (require '[foo.ddd :as fd :refer [one two]])


- name: Various require transformations in one pair
  yamlscript: |
    !ys-0
    require:
      foo::aaa: => fa
      foo::bbb: one
      foo::ccc: one two
      foo::ddd:
        => fd
        one two
      foo::eee:
      foo::fff: :all
  clojure: |
    (require
      '[foo.aaa :as fa]
      '[foo.bbb :refer [one]]
      '[foo.ccc :refer [one two]]
      '[foo.ddd :as fd :refer [one two]]
      'foo.eee
      '[foo.fff :refer :all])


- name: 'require ns: :all'
  yamlscript: |
    !ys-0
    require foo::bar: :all
  clojure: |
    (require '[foo.bar :refer :all])


- name: Anonymous function with name
  yamlscript: |
    !ys-0
    fn add(a b): a + b
  clojure: |
    (fn add [a b] (add+ a b))


- name: Multi-arity anonymous function with name
  yamlscript: |
    !ys-0
    fn add:
      (): 0
      (a b): a + b
  clojure: |
    (fn add (() 0) ((a b) (add+ a b)))


- name: Keywords then and else for if
  yamlscript: |
    !ys-0
    if (x == 1):
      then:
        a: b
        c: d
      else:
        e: f
  clojure: |
    (if (= x 1) (do (a b) (c d)) (e f))


- name: Keywords then and else for if with scalar actions
  yamlscript: |
    !ys-0
    if (x == 1):
      then: a(b)
      else:
        c: d
        e: f
  clojure: |
    (if (= x 1) (a b) (do (c d) (e f)))


- name: Using else without then
  yamlscript: |
    !ys-0
    if (x == 1):
      a: b
      else: c
  clojure: |
    (if (= x 1) (a b) c)


- name: Using else without then for if-not
  yamlscript: |
    !ys-0
    if-not (x == 1):
      a: b
      else: c
  clojure: |
    (if-not (= x 1) (a b) c)


- name: Using then without else
  yamlscript: |
    !ys-0
    if (x == 1):
      then: a(b)
  error: |
    Invalid 'if' form


- name: Error when using then and not else
  yamlscript: |
    !ys-0
    if (x == 1):
      then: a(b)
      =>:
        c: d
        e: f
  error: |
    Form after 'then' must be 'else'


- name: Support vector destructuring in bindings with *xs
  yamlscript: |
    !ys-0
    for [x *xs] lst:
      a: b
  clojure: |
    (for [[x & xs] lst] (a b))


- name: Support vector destructuring if def
  yamlscript: |
    !ys-0
    defn foo():
      +[x *y] =: z
  clojure: |
    (defn foo [] (let [[x & y] z]))
