- name: Atoms
  ys: |
    vector:
      =>: 1
      =>: 2.3
      =>: "foo"
      =>: true
      =>: false
      =>: +[1 2 3]
      =>: +{:a 1 :b 2}
  eval: |
    [1 2.3 "foo" true false [1 2 3] {:a 1, :b 2}]


- name: Operator + combinations
  ys: |
    vector:
      =>: 1 + 2
      =>: 1 + 2 + 3
      =>: +"foo" + "bar"
      =>: +[1 2] + [3 4]
  eval: |
    [3 6 "foobar" (1 2 3 4)]


- name: Dot threading
  ys: |
    n =: 10
    =>: n.inc().vector().repeat(3)
         .flatten().repeat(2)
         .flatten().take(5)
  eval: |
    [11 11 11 11 11]


- name: Put aliases assoc
  ys: |
    use ys::std: :as std
    =>: +[
      put(hash-map("a" 1) "b" 2)
      std/put(hash-map("a" 1) "b" 2)]
  eval: |
    [{"a" 1, "b" 2} {"a" 1, "b" 2}]


- name: Del aliases dissoc
  ys: |
    use ys::std: :as std
    =>: +[
      del(hash-map("a" 1 "b" 2) "b")
      std/del(hash-map("a" 1 "b" 2 "c" 3) "b" "c")
      hash-map("a" 1 "b" 2).del("b")]
  eval: |
    [{"a" 1} {"a" 1} {"a" 1}]


- name: Dotted assignment paths
  ys: |
    calls =: atom(0)
    defn choose(container):
      swap: calls inc
      =>: container.which
    a =:
      hash-map(
        "outer"
        hash-map(
          "which" "target"
          "target" hash-map("d" 1)))
    b =: hash-map(:d 1)
    c =: hash-map(\'d 1)
    missing =: hash-map()
    a.outer.choose().d =: 4
    b.d =: 2
    c.d =: 2
    missing.d =: 3
    =>: +[a b c missing calls.@]
  eval: |
    [{"outer" {"which" "target", "target" {"d" 4}}}
     {:d 2}
     {d 2}
     {"d" 3}
     1]


- name: Mixed and repeated dotted assignment targets
  ys: |
    defn assign(a d):
      a.b c d.e =: 3 4 5
      a.b a.c =: +[6 7]
      =>: +[a c d]
    assign:
      hash-map("b" 1)
      hash-map("e" 2)
  eval: |
    [{"b" 6, "c" 7} 4 {"e" 5}]


- name: Dotted compound and conditional assignments
  ys: |
    a =: hash-map("n" 2 "items" hash-map("x" 1))
    a.n +=: 3
    a.items .=: assoc("y" 2)
    a.n :if false *=: 10
    =>: a
  eval: |
    {"n" 5, "items" {"x" 1, "y" 2}}


- name: Splat expression and vector values
  ys: |
    defn numbers(): 3 .. 4
    =>: +[add((1 .. 4)*) add(numbers()*) sub((1 .. 10):reverse*)]
  eval: |
    [10 7 -35]


- name: YeS expression pair topic
  ys: |
    defn choose(x):
      _ ||| x:
        str: x
    sum =:
      3 + _: 4
    double =:
      _ + _: 4
    =>: +[choose(0) choose(2) sum double]
  eval: |
    ["0" "2" 7 8]


- name: Code-value mappings and sequences
  ys: |
    x =: 2
    value =:::
      scalar: inc(x)
      nested:
        product: x * 3
      items:
      - x
      - x + 4
      literal: 'x'
      interpolated: "x=$x"
    =>: value
  eval: |
    {"scalar" 3,
     "nested" {"product" 6},
     "items" [2 6],
     "literal" "x",
     "interpolated" "x=2"}


- name: Code-value flow collections
  ys: |
    x =: 2
    mapping =::: {a: inc(x), b: x * 4}
    sequence =::: [inc(x), x * 4]
    =>: +[mapping sequence]
  eval: |
    [{"a" 3, "b" 8} [3 8]]


- name: Code-value data overrides and re-entry
  ys: |
    x =: 2
    value =:::
      data::
        literal: inc(x)
        computed:: inc(x)
      items:
      - ! inc(x)
      - inc(x)
      nested:::
        computed: inc(x)
    =>: value
  eval: |
    {"data" {"literal" "inc(x)", "computed" 3},
     "items" ["inc(x)" 3],
     "nested" {"computed" 3}}


- name: Code-value data features
  ys: |
    x =: 2
    base =::: &base
      first: inc(x)
    value =:::
      <<: *base
      optional:?: x * 2
      local =: x * 3
      result: local
    =>: value
  eval: |
    {"first" 3, "optional" 4, "result" 6}


- name: Code-value marker in data mode
  ys: |
    x =: 2
    value =::
      nested:::
        computed: inc(x)
    =>: value
  eval: |
    {"nested" {"computed" 3}}


- name: Code-value generic pair
  ys: |
    x =: 2
    identity:::
      computed: inc(x)
  eval: |
    {"computed" 3}


- name: Data sequence code insertions return vectors
  ys: |
    =>::
    - :when true: 41.++
    - 99
  eval: |
    [42 99]


- name: Property lookup preserves false values
  ys: |
    identity({'y' false}.y)
  eval: |
    false


- name: Deferred references evaluate mapping values
  raw: true
  ys: |
    !ys-0:
    a: 3
    b: 4
    c:: *.a * *.b
  eval: |
    {"a" 3, "b" 4, "c" 12}


- name: Deferred references preserve absent conditional keys
  raw: true
  ys: |
    !ys-0:
    a:?: nil
    b:: *.a
  eval: |
    {"b" nil}


- name: Nested mapping references use the document snapshot
  raw: true
  ys: |
    !ys-0:
    a:
      b:: 3 + *.c
      c: 4
  eval: |
    {"a" {"b" 7, "c" 4}}


- name: Later base values are visible to deferred references
  raw: true
  ys: |
    !ys-0:
    a:: *.b
    b: 4
  eval: |
    {"a" 4, "b" 4}


- name: Deferred dependencies are reordered before their dependents
  raw: true
  ys: |
    !ys-0:
    a:: *.b
    b:: *.c
    c: 4
  eval: |
    {"a" 4, "b" 4, "c" 4}


- name: Deferred dependency chains are ordered transitively
  raw: true
  ys: |
    !ys-0:
    a:: *.b + 2
    b:: *.c * 3
    c:: *.d - 2
    d: 6
  eval: |
    {"a" 14, "b" 12, "c" 4, "d" 6}


- name: Shared deferred dependencies precede both dependents
  raw: true
  ys: |
    !ys-0:
    total:: *.left + *.right
    left:: *.base + 2
    right:: *.base * 3
    base:: *.seed * 2
    seed: 4
  eval: |
    {"total" 34, "left" 10, "right" 24, "base" 8, "seed" 4}


- name: Ready deferred expressions are selected in source order
  raw: true
  ys: |
    !ys-0:
    a:: *.b * 2
    independent:: *.seed + 3
    b:: *.seed + 2
    seed: 4
  eval: |
    {"a" 12, "independent" 7, "b" 6, "seed" 4}


- name: Ancestor and root references compose
  raw: true
  ys: |
    !ys-0:
    top: 2
    nested:
      a: 3
      b:: *.a * *^.top
    root-copy:: */top
  eval: |
    {"top" 2,
     "nested" {"a" 3, "b" 6},
     "root-copy" 2}


- name: Container ancestors include intervening sequences
  raw: true
  ys: |
    !ys-0:
    outer: 6
    items:
    - one-caret:: *^.outer
      two-carets:: *^^.outer
  eval: |
    {"outer" 6,
     "items" [{"one-caret" nil, "two-carets" 6}]}


- name: Root references evaluate sequence entries
  raw: true
  ys: |
    !ys-0:
    - 7
    - ! */0
  eval: |
    [7 7]


- name: Containing collection call forms are equivalent
  raw: true
  ys: |
    !ys-0:
    - 1
    - 2
    - ! count(*.)
    - ! *:count
  eval: |
    [1 2 4 4]


- name: Sequence sibling reference forms
  raw: true
  ys: |
    !ys-0:
    - 111
    - 6
    - ! (*.-1 * *.+1)
    - 7
    - ! (*- * *+)
    - 6
    - ! (*.1 * *.$)
    - 7
  eval: |
    [111 6 42 7 42 6 42 7]


- name: Mapping siblings use insertion order
  raw: true
  ys: |
    !ys-0:
    a: 6
    b:: *- * *+
    c: 7
  eval: |
    {"a" 6, "b" 42, "c" 7}


- name: Ancestor sibling references select collection siblings
  raw: true
  ys: |
    !ys-0:
    - [10]
    - [20, ! *^-, ! *^+]
    - [30]
  eval: |
    [[10] [20 [10] [30]] [30]]


- name: Sibling bounds return nil
  raw: true
  ys: |
    !ys-0:
    - ! *-
    - middle
    - ! *+
  eval: |
    [nil "middle" nil]


- name: Relative siblings use evaluated sequence positions
  raw: true
  ys: |
    !ys-0:
    - :when false: 100
    - 6
    - ! *+
    - 7
  eval: |
    [6 7 7]


- name: Mapping siblings skip omitted conditional entries
  raw: true
  ys: |
    !ys-0:
    :when false:
      skipped: 5
    a: 6
    b:: *-
  eval: |
    {"a" 6, "b" 6}


- name: Numeric and repeated ancestor depths are equivalent
  raw: true
  ys: |
    !ys-0:
    root-value: 42
    a:
      b:
        c:
          d:
            e:
              numeric:: *^5.root-value
              repeated:: *^^^^^.root-value
  eval: |
    {"root-value" 42,
     "a" {"b" {"c" {"d" {"e" {"numeric" 42, "repeated" 42}}}}}}


- name: Bare mode aliases remain immediate
  raw: true
  ys: |
    - &answer 42
    - *answer
  eval: |
    [42 42]


- name: Data aliases observe current anchored paths
  raw: true
  ys: |
    !ys-0:
    base: &base
      x: 1
      y:: *.x + 1
    copy: *base
  eval: |
    {"base" {"x" 1, "y" 2},
     "copy" {"x" 1, "y" 2}}


- name: Alias references evaluate special dot operators
  raw: true
  ys: |
    !ys-0:
    number: &number 2
    items: &items [1, 2, 3]
    count:: *items.#
    last:: *items.$
    truey:: *items.?
    falsey:: *items.!
    boolean:: *items.??
    not:: *items.!!
    increment:: *number.++
    decrement:: *number.--
    embedded:: (*number.++ * 2)
  eval: |
    {"number" 2,
     "items" [1 2 3],
     "count" 3,
     "last" 3,
     "truey" true,
     "falsey" false,
     "boolean" true,
     "not" false,
     "increment" 3,
     "decrement" 1,
     "embedded" 6}


- name: Expression alias names use the restricted base grammar
  raw: true
  ys: |
    !ys-0:
    one: &123 1
    two: &_foo 2
    three: &foo-bar 3
    sum:: (*123 + *_foo + *foo-bar)
  eval: |
    {"one" 1, "two" 2, "three" 3, "sum" 6}


- name: Alias references evaluate predicate colon calls
  raw: true
  ys: |
    !ys-0:
    items: &items []
    empty:: *items:empty?
  eval: |
    {"items" [], "empty" true}


- name: Data merge aliases are deferred
  raw: true
  ys: |
    !ys-0:
    defaults: &defaults
      x: 1
      y: 2
    value:
      <<: *defaults
      y: 3
  eval: |
    {"defaults" {"x" 1, "y" 2},
     "value" {"x" 1, "y" 3}}


- name: Stream references see completed documents
  raw: true
  ys: |
    !ys-0
    =>::
      index:: **:count
    --- !ys
    =>::
      index:: **:count
      previous:: **.-1
      current:: **.$
  eval: |
    {"index" 1,
     "previous" {"index" 0},
     "current" {"index" 0}}


- name: Data aliases resolve paths in completed documents
  raw: true
  ys: |
    !ys-0
    =>::
      base: &base
        x: 1
    --- !ys
    =>::
      copy: *base
  eval: |
    {"copy" {"x" 1}}


- name: Code documents read the completed stream with double star
  raw: true
  ys: |
    !ys-0
    =>::
      name: first
      value: 10
    --- !ys
    =>::
      name: second
      some: thing
    --- !ys
    =>: merge.apply(**)
  eval: |
    {"name" "second", "value" 10, "some" "thing"}
